version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # BUG-11 FIX: VITE_ vars must be passed as build-args, not runtime env
        # because Vite bakes them into the JS bundle at build time.
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:5173}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - ALLOW_PASSKEY_RESET=${ALLOW_PASSKEY_RESET:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backend_logs:/app/logs
      # BUG-17 FIX: Mount data directory as named volume so settings.json
      # and auth.db persist across docker-compose recreates
      - backend_data:/app/data
    restart: unless-stopped

volumes:
  backend_logs:
  backend_data:
