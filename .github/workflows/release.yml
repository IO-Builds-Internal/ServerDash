name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ServerDash ${{ github.ref_name }} 🚀
          body: |
            ## ServerDash ${{ github.ref_name }} 🚀
            
            We are excited to announce the release of **ServerDash ${{ github.ref_name }}**!
            
            ### ✨ What's New:
            - **💻 Postgres SQL Editor & Tables Explorer**: Visual database schema tables sidebar navigator and query runner integrated inside the full-page Supabase dashboard.
            - **⚡ Bypassed Supavisor Connection Restrictions**: Dynamically fetches the PostgreSQL container IP for direct, fast, reliable database queries, bypassing Pooler blocks.
            - **📍 Unified Websites Stack Tabs**: Effortlessly filter and isolate websites by categories (`Supabase`, `WordPress / PHP`, `Node.js`, `Static / HTML`, `System Panel`).
            - **📬 Premium SMTP Dashboard**: Real-time Postfix system control cards, live diagnostic terminal streams, and dynamic server-domain discovery.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
